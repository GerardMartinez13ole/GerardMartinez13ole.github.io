<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Creador de camisetas de fútbol 3D avanzado. Funciona 100% offline como PWA. Personaliza colores, patrones, logos y tipografía." />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>Kit Creator 3D Pro — Offline</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />

  <!-- Google Fonts (cacheadas por el Service Worker) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Russo+One&family=Anton&family=Righteous&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Three.js Import Map (CDN → cacheado por SW) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
    }
  }
  </script>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="site-navbar"></div>

  <div id="app">

    <!-- ═══ Three.js Canvas ═══ -->
    <canvas id="three-canvas"></canvas>

    <!-- ──── Top Bar ──── -->
    <header id="top-bar">
      <div class="brand">
        <div class="logo">⚽</div>
        <h1>KIT CREATOR HOLAAAAAAA</h1>
      </div>
      <div class="top-actions">
        <button id="btn-rotate" class="btn btn-ghost btn-sm" title="Auto-Rotación">🔄 Rotar aaaaa</button>
        <button id="btn-change-model" class="btn btn-ghost btn-sm" title="Cambiar Modelo 3D">👕 Modelo</button>
        <button id="btn-reset-cam" class="btn btn-ghost btn-sm" title="Reset Cámara">📷 Reset</button>
        <button id="btn-export-3d" class="btn btn-export btn-sm" title="Descargar vista 3D">⬇ Descargar PNG</button>
      </div>
    </header>

    <!-- ──── Floating Control Panel ──── -->
    <aside id="control-panel">

      <!-- Tab Bar -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="base">🎨 Base</button>
        <button class="tab-btn" data-tab="patterns">◆ Patrones</button>
        <button class="tab-btn" data-tab="logos">🏷 Logos</button>
        <button class="tab-btn" data-tab="text">Aa Texto</button>
      </div>

      <!-- Tab Panels (scrollable) -->
      <div class="tab-panels">

        <!-- ═══ TAB: Base ═══ -->
        <div class="tab-panel active" id="panel-base">
          <div class="field">
            <label for="base-color">Color Principal</label>
            <div class="color-row">
              <input type="color" id="base-color" value="#1a1a1a" />
              <span class="hex" id="base-color-hex">#1A1A1A</span>
            </div>
          </div>
          <div class="field">
            <label>Presets</label>
            <div class="presets" id="color-presets"></div>
          </div>
          <div class="field">
            <label for="secondary-color">Color Mangas</label>
            <div class="color-row">
              <input type="color" id="secondary-color" value="#1a1a1a" />
              <span class="hex" id="secondary-color-hex">#1A1A1A</span>
            </div>
          </div>
          <div class="field">
            <label for="collar-color">Color Cuello</label>
            <div class="color-row">
              <input type="color" id="collar-color" value="#111111" />
              <span class="hex" id="collar-color-hex">#111111</span>
            </div>
          </div>

          <!-- Interactive Preview -->
          <div class="field">
            <label>Vista Previa (arrastra elementos)</label>
            <div class="preview-wrap">
              <canvas id="tex-preview" width="400" height="400"></canvas>
              <span class="preview-label">UV Texture</span>
            </div>
          </div>
        </div>

        <!-- ═══ TAB: Patterns ═══ -->
        <div class="tab-panel" id="panel-patterns">
          <div class="field">
            <label>Tipo de Patrón</label>
            <div class="pat-grid" id="pat-grid"></div>
          </div>
          <div class="field">
            <label for="pat-color">Color del Patrón</label>
            <div class="color-row">
              <input type="color" id="pat-color" value="#ffffff" />
              <span class="hex" id="pat-color-hex">#FFFFFF</span>
            </div>
          </div>
          <div class="field">
            <label>Opacidad <span class="rv" id="pat-op-v">50%</span></label>
            <input type="range" id="pat-op" min="0" max="100" value="50" />
          </div>
          <div class="field">
            <label>Escala <span class="rv" id="pat-sc-v">1.0x</span></label>
            <input type="range" id="pat-sc" min="10" max="120" value="40" />
          </div>
          <button id="btn-clear-pat" class="btn btn-ghost btn-sm" style="align-self:flex-start">✕ Quitar Patrón</button>
        </div>

        <!-- ═══ TAB: Logos ═══ -->
        <div class="tab-panel" id="panel-logos">
          <div class="field">
            <label>Subir Logo (PNG / SVG)</label>
            <div class="upload-zone" id="upload-zone">
              <div class="icon">📁</div>
              <p>Arrastra o haz clic</p>
              <span class="hint">PNG, SVG, JPG — máx. 5 MB</span>
              <input type="file" id="file-input" accept="image/png,image/svg+xml,image/jpeg,image/webp" hidden />
            </div>
          </div>
          <div class="logo-list" id="logo-list"></div>
          <div class="field" id="logo-ctrls" style="display:none">
            <label>Posición X <span class="rv" id="lx-v">50%</span></label>
            <input type="range" id="logo-x" min="5" max="95" value="50" />
            <label style="margin-top:4px">Posición Y <span class="rv" id="ly-v">42%</span></label>
            <input type="range" id="logo-y" min="5" max="95" value="42" />
            <label style="margin-top:4px">Tamaño <span class="rv" id="ls-v">15%</span></label>
            <input type="range" id="logo-s" min="3" max="50" value="15" />
          </div>
        </div>

        <!-- ═══ TAB: Text ═══ -->
        <div class="tab-panel" id="panel-text">
          <!-- Name -->
          <div class="field">
            <label for="p-name">Nombre del Jugador</label>
            <input type="text" id="p-name" placeholder="Ej: MESSI" maxlength="20" />
          </div>
          <div class="field">
            <label for="name-font">Tipografía</label>
            <select id="name-font">
              <option value="Bebas Neue">Bebas Neue</option>
              <option value="Orbitron">Orbitron</option>
              <option value="Oswald">Oswald</option>
              <option value="Russo One">Russo One</option>
              <option value="Anton">Anton</option>
              <option value="Righteous">Righteous</option>
              <option value="Teko">Teko</option>
              <option value="Inter">Inter</option>
            </select>
          </div>
          <div class="font-preview" id="name-prev">NOMBRE</div>
          <div class="field">
            <label for="name-color">Color Nombre</label>
            <div class="color-row">
              <input type="color" id="name-color" value="#ffffff" />
              <span class="hex" id="name-color-hex">#FFFFFF</span>
            </div>
          </div>
          <div class="field">
            <label>Tamaño <span class="rv" id="name-sz-v">90</span></label>
            <input type="range" id="name-sz" min="30" max="160" value="90" />
          </div>

          <hr style="border:none;border-top:1px solid var(--border);margin:6px 0" />

          <!-- Number -->
          <div class="field">
            <label for="p-number">Número</label>
            <input type="text" id="p-number" placeholder="Ej: 10" maxlength="3" />
          </div>
          <div class="field">
            <label for="num-font">Tipografía Número</label>
            <select id="num-font">
              <option value="Bebas Neue">Bebas Neue</option>
              <option value="Orbitron">Orbitron</option>
              <option value="Oswald">Oswald</option>
              <option value="Russo One">Russo One</option>
              <option value="Anton">Anton</option>
              <option value="Righteous">Righteous</option>
              <option value="Teko">Teko</option>
              <option value="Inter">Inter</option>
            </select>
          </div>
          <div class="field">
            <label for="num-color">Color Número</label>
            <div class="color-row">
              <input type="color" id="num-color" value="#ffffff" />
              <span class="hex" id="num-color-hex">#FFFFFF</span>
            </div>
          </div>
          <div class="field">
            <label>Tamaño <span class="rv" id="num-sz-v">220</span></label>
            <input type="range" id="num-sz" min="60" max="350" value="220" />
          </div>
        </div>

      </div><!-- /tab-panels -->

      <!-- Panel Footer — Project & Export Actions -->
      <div class="panel-footer">
        <div class="row">
          <button id="btn-save" class="btn btn-success btn-sm">💾 Guardar</button>
          <button id="btn-load" class="btn btn-ghost btn-sm">📂 Cargar</button>
          <button id="btn-export-json" class="btn btn-ghost btn-sm">📤 Exportar JSON</button>
          <button id="btn-import-json" class="btn btn-ghost btn-sm">📥 Importar JSON</button>
          <input type="file" id="file-import-json" accept=".json" hidden />
        </div>
        <button id="btn-export-tex" class="btn btn-export btn-sm" style="width:100%">⬇ Exportar Textura 2K (.png)</button>
      </div>

    </aside>

    <!-- ──── Scene View Controls ──── -->
    <div id="scene-controls">
      <button class="btn btn-ghost btn-icon btn-sm" data-view="front" title="Frontal">▮</button>
      <button class="btn btn-ghost btn-icon btn-sm" data-view="back" title="Trasera">▯</button>
      <button class="btn btn-ghost btn-icon btn-sm" data-view="left" title="Izquierda">◂</button>
      <button class="btn btn-ghost btn-icon btn-sm" data-view="right" title="Derecha">▸</button>
    </div>

    <!-- ──── Camera Movement Controls ──── -->
    <div id="camera-move-controls" class="camera-controls" style="background: rgba(10, 15, 28, 0.88); padding: 8px; border-radius: 8px; border: 1px solid var(--border);">
      <div class="controls-row" style="justify-content: space-between; width: 100%;">
        <input type="number" id="step-up" value="0.1" step="0.1" title="Mover arriba" style="width: 45px; height: 24px; padding: 0 4px; font-size: 0.75rem; text-align: center; border-radius: 4px; border: 1px solid var(--border); background: var(--input); color: var(--t1);">
        <button class="btn btn-ghost btn-icon btn-sm" id="btn-move-up" title="Mover Arriba (↑)">▲</button>
      </div>
      <div class="controls-row" style="justify-content: space-between; width: 100%;">
        <input type="number" id="step-down" value="0.1" step="0.1" title="Mover abajo" style="width: 45px; height: 24px; padding: 0 4px; font-size: 0.75rem; text-align: center; border-radius: 4px; border: 1px solid var(--border); background: var(--input); color: var(--t1);">
        <button class="btn btn-ghost btn-icon btn-sm" id="btn-move-down" title="Mover Abajo (↓)">▼</button>
      </div>
      <div class="controls-row" style="justify-content: space-between; width: 100%;">
        <input type="number" id="step-left" value="0.1" step="0.1" title="Mover izquierda" style="width: 45px; height: 24px; padding: 0 4px; font-size: 0.75rem; text-align: center; border-radius: 4px; border: 1px solid var(--border); background: var(--input); color: var(--t1);">
        <button class="btn btn-ghost btn-icon btn-sm" id="btn-move-left" title="Mover Izquierda (←)">◀</button>
      </div>
      <div class="controls-row" style="justify-content: space-between; width: 100%;">
        <input type="number" id="step-right" value="0.1" step="0.1" title="Mover derecha" style="width: 45px; height: 24px; padding: 0 4px; font-size: 0.75rem; text-align: center; border-radius: 4px; border: 1px solid var(--border); background: var(--input); color: var(--t1);">
        <button class="btn btn-ghost btn-icon btn-sm" id="btn-move-right" title="Mover Derecha (→)">▶</button>
      </div>
    </div>

    <!-- ──── Status Bar ──── -->
    <div id="status-bar">
      <span class="dot"></span>
      <span id="status-text">PWA Offline Ready</span>
    </div>

    <!-- ──── Toasts ──── -->
    <div class="toast-box" id="toast-box"></div>

    <!-- ──── Project Modal (hidden) ──── -->
    <div id="project-modal" class="modal-overlay" style="display:none">
      <div class="modal">
        <div class="modal-header">
          <h2>📂 Proyectos Guardados</h2>
          <button class="close" id="modal-close">✕</button>
        </div>
        <div class="modal-body" id="project-list"></div>
      </div>
    </div>

  </div>

  <!-- App Logic (ES Module) -->
  <script src="../navbar.js"></script>
  <script type="module" src="app.js"></script>

</body>
</html>
